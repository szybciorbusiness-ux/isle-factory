<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Isle Factory · phone</title>
  <style>
    /* Phone simulator: the same iPhone 17 Pro bezel as Blob Blitz around a 402x874 screen. The game runs in an
       iframe at exactly that CSS size (so its media queries and layout are the real portrait ones); the whole
       phone is scaled with a transform to fit the window. On a real phone you'd open the game itself. */
    :root { --ink: #1f2a24; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: grid; place-items: center;
      background: radial-gradient(120% 90% at 50% 10%, #eaf8f1 0%, #cfeee2 45%, #a9dccb 100%);
      font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    }
    #phone { position: relative; width: 450px; height: 920px; transform-origin: 50% 50%; flex: none; }
    #screen { position: absolute; left: 24px; top: 23px; width: 402px; height: 874px; border-radius: 63px; overflow: hidden;
      background: #cfeee2; isolation: isolate; }
    #game { position: absolute; inset: 0; width: 402px; height: 874px; border: 0; display: block; background: #cfeee2; }
    #bezel { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; user-select: none; }
    #status { position: absolute; z-index: 3; pointer-events: none; left: 0; right: 0; top: 0; height: 62px;
      display: flex; align-items: center; gap: 154px; padding: 2px 24px 0; box-sizing: border-box;
      color: var(--ink); font: 590 17px/1 -apple-system, "SF Pro Text", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    #status > div { flex: 1 0 0; display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 0; }
    #status img { display: block; height: auto; filter: brightness(0) saturate(100%) invert(13%) sepia(10%) saturate(900%) hue-rotate(95deg); }
    #status .cell { width: 19.2px; } #status .wifi { width: 17.142px; } #status .batt { width: 27.328px; }
    #home { position: absolute; z-index: 3; pointer-events: none; left: 50%; bottom: 8px; width: 140px; height: 5px; margin-left: -70px;
      border-radius: 3px; background: rgba(31, 42, 36, 0.78); }
    #shadow { position: absolute; left: 30px; right: 30px; bottom: -26px; height: 50px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(40, 80, 64, 0.32), rgba(40, 80, 64, 0)); z-index: -1; }
  </style>
</head>
<body>
  <div id="phone">
    <div id="shadow" aria-hidden="true"></div>
    <div id="screen">
      <iframe id="game" title="Isle Factory" src="../?camp=1&amp;mobile=1&amp;safeTop=59&amp;safeBottom=24" allow="autoplay; fullscreen"></iframe>
      <div id="status" aria-hidden="true">
        <div><span id="clock">9:41</span></div>
        <div><img class="cell" src="cellular.svg" alt=""><img class="wifi" src="wifi.svg" alt=""><img class="batt" src="battery.svg" alt=""></div>
      </div>
      <div id="home" aria-hidden="true"></div>
    </div>
    <img id="bezel" src="bezel.png" alt="" draggable="false">
  </div>
  <script>
    // Scale the whole phone to the window; keep keyboard focus in the game so WASD works without a click.
    const phone = document.getElementById('phone');
    const game = document.getElementById('game');
    let scale = 1;
    function fit() {
      scale = Math.max(0.3, Math.min((innerHeight - 32) / 920, (innerWidth - 32) / 450, 1.25));
      phone.style.transform = `scale(${scale})`;
      tell();
    }
    // The game renders at (its devicePixelRatio x this scale) so the scaled-up phone is crisp, not stretched.
    const tell = () => game.contentWindow?.postMessage({ type: 'isle:frameScale', value: scale }, '*');
    addEventListener('resize', fit);
    fit();
    game.addEventListener('load', () => { tell(); setTimeout(tell, 400); setTimeout(tell, 1500); game.contentWindow?.focus(); });
    addEventListener('pointerdown', e => { if (e.target === document.body) game.contentWindow?.focus(); });
  </script>
</body>
</html>
